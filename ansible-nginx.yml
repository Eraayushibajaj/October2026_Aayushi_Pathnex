-name: Install and start Nginx on Pathnex
hosts: all
become: yes

tasks:
  - name: Install nginx
  yum:
     name: nginx
     state: present

  - name: Enable nginx
  service:
    name: nginx
    state: started
    enabled: yes 

#Terraform — EC2 with Tags (r5.2xlarge)
provider "aws" {
  region = "us-east-1"
}
resource "aws_instance" "pathnex_ec2" {
  ami           = "ami-0c55b159cbfafe1f0"
  instance_type = "r5.2xlarge"
  }
  tags = {
    Name = "Pathnex-server"
    Environment = "Production"
    Owner = "Pathnex Team"
  }
}

# Kubernetes — Deployment with 2 Replicas
apiVersion: apps/v1
kind: Deployment 
metadata:
  name: pathnex-deployment
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: pathnex-app
    template:
      metadata:
        labels:
          app: pathnex-app
      spec:
        containers:
        - name: pathnex-container
          image: nginx:latest
          ports:
          - containerPort: 80
 
